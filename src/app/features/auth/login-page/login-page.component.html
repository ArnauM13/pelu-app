<div class="login-page" style="view-transition-name: login-page">
  <pelu-auth-popup
    [config]="loginConfig()"
    (submitForm)="onLoginSubmit($event)"
    (googleAuth)="onGoogleAuth()"
    (forgotPasswordRequest)="onForgotPasswordRequest($event)"
  />

  @if (hasError()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
  }


</div>
