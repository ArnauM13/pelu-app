<div class="container" [style.view-transition-name]="'appointments-container'">
  <!-- Main Content -->
            <!-- Hero Section with Title -->
        <pelu-title
          title="APPOINTMENTS.TITLE"
          subtitle="APPOINTMENTS.SUBTITLE"
        ></pelu-title>

    <div class="appointments-content">
      <!-- Filters (admins only) -->
      @if (isAdmin()) {
        <div class="content-section">
          <pelu-filters-collapsible
            [stats]="appointmentStats()"
            [filterDate]="filterDate"
            [filterClient]="filterClient"
            [filterService]="filterService"
            [quickFilter]="quickFilterString()"
            [hasActiveFilters]="hasActiveFilters()"
            [onDateChange]="setFilterDate"
            [onClientChange]="setFilterClient"
            [onServiceChange]="setFilterService"
            [onReset]="clearAllFilters"
            (quickFilterChange)="setQuickFilter($event)"
          />
        </div>
      } @else {
        <!-- Simple filter bar for client users -->
        <div class="content-section">
          <div class="user-filter-bar">
            <div class="filter-pills">
              <button
                class="filter-pill"
                [class.active]="!userHasActiveFilters()"
                (click)="setQuickFilter('all')"
              >{{ 'APPOINTMENTS.FILTER_ALL' | translate }}</button>
              <button
                class="filter-pill"
                [class.active]="filterState().quickFilters.has('upcoming')"
                (click)="setQuickFilter('upcoming')"
              >⏰ {{ 'APPOINTMENTS.FILTER_UPCOMING' | translate }}</button>
              <button
                class="filter-pill"
                [class.active]="filterState().quickFilters.has('past')"
                (click)="setQuickFilter('past')"
              >📜 {{ 'APPOINTMENTS.FILTER_PAST' | translate }}</button>
            </div>
            <button class="sort-btn" (click)="toggleUserSort()">
              @if (userSortOrder() === 'asc') {
                ↑ {{ 'APPOINTMENTS.SORT_OLDEST_FIRST' | translate }}
              } @else {
                ↓ {{ 'APPOINTMENTS.SORT_NEWEST_FIRST' | translate }}
              }
            </button>
          </div>
        </div>
      }



      <!-- Appointments List View -->
      <div class="content-section">
        <pelu-appointments-list
          [bookings]="listAppointments()"
          [hasActiveFilters]="isAdmin() ? hasActiveFilters() : false"
          [isSelectionMode]="isSelectionMode()"
          [selectedIds]="selectedIds()"
          [isAdmin]="isAdmin()"
          (viewBooking)="viewAppointmentDetail($event)"
          (deleteBooking)="deleteBookingFromList($event)"
          (clearFilters)="clearAllFilters()"
          (toggleSelection)="toggleAppointmentSelection($event)"
          (bulkDelete)="onBulkDeleteRequested($event)"
          (exportCSV)="onExportCSV($event)"
        >
        </pelu-appointments-list>
      </div>
    </div>

      <!-- View Mode Toggle (always visible)
      <pelu-appointments-view-controls
        [viewButtons]="viewButtons()"
        (viewModeChange)="setViewMode($event)"
      >
      </pelu-appointments-view-controls> -->

  <!-- Confirmation Popup -->
  <pelu-confirmation-popup
    [isOpen]="confirmationPopup().isOpen"
    [data]="confirmationPopup().data"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()"
  />
</div>
