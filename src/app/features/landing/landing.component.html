<div class="landing-container" style="view-transition-name: landing">
  <section class="hero-section" style="view-transition-name: hero-section">
    <div class="hero-content">

      <pelu-title
        title="LANDING.HERO_TITLE"
        subtitle="LANDING.HERO_SUBTITLE"
      ></pelu-title>

      <div class="main-actions" style="view-transition-name: main-actions">
        <!-- Primary CTA -->
        <pelu-button
          label="LANDING.BOOK_NOW"
          severity="primary"
          icon="pi pi-calendar-plus"
          iconPos="left"
          [raised]="true"
          [fluid]="true"
          routerLink="/booking"
        ></pelu-button>

        <!-- Secondary link -->
        <a class="secondary-link" routerLink="/appointments">
          {{ 'APPOINTMENTS.TITLE' | translate }} ›
        </a>
      </div>

    </div>
  </section>
</div>
